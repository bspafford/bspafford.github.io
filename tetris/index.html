        <project-layout
            title="Tetris"
            description="This Tetris clone was my first project using the Windows API, and also my first time stepping away from game engines like Unity or Unreal Engine. I wanted to challenge myself by working at a lower level. No built in rendering pipelines, no scene hierarchies, and no prefab systems. Just me, C++, and WinAPI. This project forced me to think differently about how games are built, and it ended up being a major turning point in how I approached programming.
                        <br><br>
                    	At the time, I barely understood C++. Through trial and error, I learned how to draw pixels to the screen, how to manage the Windows message loop, and how to create utility functions for basic rendering like drawing rectangles and grids from scratch. Every system I needed, I had to build myself: input handling, timing, game state, drawing logic, and more. The process was definitely difficult, but it taught me a lot about how engines work under the hood. It also gave me an appreciation for the tools I’d taken for granted before.
                        <br><br>
	                    This project eventually led me into OpenGL, as I became curious about more advanced rendering. More importantly, this project laid the foundation for everything else I’ve done outside of game engines. It wasn’t optimized, and it wasn’t elegant, but it was the start to a whole new world of programming. It pushed me to develop problem solving skills that continue to serve me in more complex projects today.
                        "
