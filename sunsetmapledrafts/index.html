            title="Sunset Maple Drafts"
            description="This project was built for my stepsister's horse carriage business. She needed a website where potential customers could view essential information like pricing, location, and availability, but she also wanted to manage reservations on her end without having to rely on third-party platforms. I built the site using HTML, CSS, JavaScript, PHP, and SQL, creating both a public facing site and a secure backend admin panel.
                        <br><br>
	                    The site includes a main landing page with business details, as well as a calendar page that shows which days are booked. Reservations are not made directly through the site, but instead, customers are asked to call to book, and my stepsister uses an admin portal to manage reservations manually. Through this interface, she can add, edit, remove, or search for reservations, which include fields for name, date, phone number, and email. This approach gives her full control over the booking schedule while keeping the user experience simple and clear.
                        <br><br>
	                    I also implemented a transaction history system to log every change made to the reservation database. This log includes details like the reservation ID, contact info, date, and the type of action (added, edited, removed). It helps her track updates and any mistakes that might of happened. In addition to building the functionality, I also focused on security best practices throughout the project. I made sure the admin login system was protected and used prepared statements to guard against SQL injection attacks. Working on a real system that stores user data pushed me to think more carefully about validation, authentication, and overall data integrity. Overall, this project gave me valuable experience working with real client requirements, integrating frontend and backend systems, and thinking through usability from both the customer and admin perspectives.
                        "
