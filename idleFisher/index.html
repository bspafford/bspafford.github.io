            title="Idle Fisher"
            description="This is by far the biggest and most ambitious game project I've worked on. It's an idle fishing game developed in C++ using OpenGL and GLSL, with support libraries like GLFW, GLAD, and GLM. What started as a quick idea has evolved into a long-term passion project, complete with fishing mechanics, upgrade systems, currency management, rebirths, and multiple worlds. Players can catch fish, buy equipment upgrades, sell fish to earn money, purchase Auto Fishers, and unlock new areas, each with its own currency, map, fish, and pets.
                        <br><br>
                        The development journey itself reflects how much I've grown as a programmer. The project originally began in Unreal Engine back in November 2023, with a look inspired by Octopath Traveler. Although I made good progress, I wasn't satisfied with the direction or the engine's overhead for a 2D game. In July 2024, I restarted it in SDL with C++, but soon hit limitations that held back the visual and gameplay features I had in mind. Finally, in May 2025, I moved the project to OpenGL, giving me the low level control I needed to build advanced systems and start working with custom shaders.
                        <br><br>
                        This game has kept me engaged like no other project, and my goal is to eventually polish and release it on Steam. Currently, there are eight unique NPCs, each offering different mechanics like gear upgrades, travel between worlds, fish transportation, and rebirth systems. I've used this project to push myself creatively and technically, whether by hand coding the rendering pipeline, designing modular gameplay systems, or managing state and save data for an expanding idle economy. It's been a huge learning experience, and one I'm fully committed to seeing it through.
                        "
