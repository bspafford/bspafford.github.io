        <project-layout
            title="CALCulator"
            description="CALCulator was built using Python and Tkinter as the final project for my high school calculus class. While most of the class opted for traditional creative projects like music videos or skits, I wanted to build something functional, something that could actually make doing calculus easier. I was frustrated with the limitations of the TI-84, especially how often I had to switch between paper and calculator just to solve a single problem. So my goal was to make a tool that could do more.
                        <br><br>
	                    The goal was to replicate and expand on the features of a TI-84, with a focus on calculus specific functionality. The calculator handles basic operations like substitution, limits, and tangent lines, but also goes much further supporting derivatives, integrals, area between curves, volumes of rotation, cross sectional volumes, and more. Everything is packaged in a simple GUI so that you can input full expressions and get answers without constantly jumping between tools.
                        <br><br>
	                    What started as a school assignment quickly turned into a deeper dive into both programming and mathematics. This project pushed me to learn how to parse mathematical input, handle symbolic computation, and build clean interfaces for user input and output. It also showed me how software could make abstract concepts more accessible, something I’ve kept in mind for later projects.
                    "
            video="media/CALCulator.mp4"

            }'
            links='{

            }'>
        </project-layout>
