        <project-layout
            title="Splitplane"
            description="This is a project I'd been wanting to create for a long time, inspired by the Portal series. I've always found portal mechanics fascinating, not just visually, but technically. I built this in Unity using C#, aiming to recreate the seamless experience of placing portals, walking through them, and using them to solve spatial puzzles. Along the way, I implemented several illusions and effects that play with player perception and world logic.
                        <br><br>
                        A big part of the challenge was handling the math behind portals, especially making teleportation feel smooth and convincing. I had to account for proper object orientation, camera clipping, and recursive rendering so that portals could display what's behind them in real time. The player can place portals on walls and walk through them without interruption. I also implemented physics interactions, like carrying a companion cube and moving it through portals while preserving its momentum and rotation.
                        <br><br>
	                    Beyond the core mechanics, I experimented with other visual tricks using portals. For example, I built a tunnel that appears long from the outside but is actually short inside, and a cube where each side reveals a completely different room. I also created a simulation room where every wall is a portal to another variation of the space. This project taught me a lot about recursive rendering, shader management, and the creative potential of camera based illusions in game design.
                        "
            video="https://www.youtube.com/embed/Kp6nuJQ0GqE?si=U-xCilQC4AjlPYba"
