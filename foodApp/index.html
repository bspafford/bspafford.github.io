        <project-layout
            title="Bitewise"
            description="As someone who's very into fitness and health, I wanted an easier and more flexible way to track my calories. Many existing food tracking apps lock useful features, like barcode scanning, behind expensive premium subscriptions. Rather than pay for those features, I decided to build my own nutrition tracker from scratch. The app includes a wide range of features: users can search for foods by name or barcode, add/edit/delete food entries, track meals across different dates, and log their weight over time.
                        <br><br>
	                    On first launch, the app presents a simple questionnaire that collects basic information such as age, gender, weight, and activity level to estimate daily caloric needs. From there, users are taken to a clean, minimal home screen where they can view their daily meals, check their macronutrient breakdown, or search for foods. All food data is pulled from a local database on my machine, based on the USDA's FoodData Central database, which allows for detailed nutritional info without relying on third-party services.
                        <br><br>
	                    This project is still a work in progress, and I have several planned features in development. One major goal is to implement adaptive calorie estimation, tracking user weight changes over time and adjusting daily calorie needs based on actual progress. Building this app has taught me a lot about backend data handling, user experience design, and the value of creating tools that directly solve personal problems.
                        "
